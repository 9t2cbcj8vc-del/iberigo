<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Thank you — IberiGo</title>
    <link rel="stylesheet" href="/styles.css?v=20260926-timeline-stack" />
    <link rel="stylesheet" href="/styles-help-feedback.css?v=20260820-help-feedback-1" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <style data-iberigo-visual-ux-cleanup>
      html, body {
        max-width: 100%;
        overflow-x: clip;
      }
      .app-shell {
        max-width: 100%;
        min-width: 0;
        overflow-x: clip;
      }
      @media (max-width: 760px) {
        .topbar {
          display: flex !important;
          flex-wrap: wrap !important;
          align-items: center !important;
          gap: 4px 9px !important;
          padding: 6px 14px !important;
          min-width: 0;
          max-width: 100%;
          box-sizing: border-box;
        }
        .brand-lockup { flex: 0 1 auto; min-width: 0; }
        .brand-wordmark { font-size: 22px; }
        .topbar nav {
          display: flex !important;
          flex: 1 1 100% !important;
          width: 100% !important;
          min-width: 0 !important;
          flex-wrap: wrap !important;
          align-items: center !important;
          justify-content: flex-start !important;
          gap: 6px !important;
        }
        .topbar nav a {
          flex: 0 1 auto !important;
          min-height: 38px;
          padding: 8px 11px !important;
        }
        .topbar .search-nav-link { order: -2; }
        .topbar .language-switcher {
          order: -1;
          flex: 0 0 auto !important;
          width: auto !important;
          min-height: 38px;
          justify-content: flex-start !important;
          padding: 3px !important;
        }
        .topbar .language-switcher button {
          min-width: 34px;
          min-height: 32px;
        }
        main > section { scroll-margin-top: 118px; }
      }
      @media (max-width: 420px) {
        .topbar { padding-inline: 12px !important; gap: 4px 8px !important; }
        .topbar nav { gap: 3px 5px !important; }
        .topbar nav a {
          flex-basis: auto !important;
          padding-inline: 10px !important;
          font-size: 0.82rem;
        }
        .topbar .language-switcher {
          width: auto !important;
          justify-content: flex-start !important;
        }
        main > section { scroll-margin-top: 112px; }
      }
    </style>
  </head>
  <body class="help-feedback-page">
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-lockup"><a class="brand-home-link" href="/" aria-label="IberiGo home"><span class="brand-wordmark">Iberi<span class="brand-wordmark-accent">Go</span></span></a></div>
      </header>
      <main class="hf-success-shell">
        <section class="hf-panel hf-success-card">
          <span class="hf-kicker">Message sent</span>
          <h1>Thank you.</h1>
          <p>Your message has been submitted to IberiGo. If you included an email address and a reply is useful, we may contact you for more detail.</p>
          <a href="/">Back to IberiGo</a>
        </section>
      </main>
      <footer class="site-footer"><p>© 2026 IberiGo. Free to use. Not legal advice.</p><a href="/help-feedback/">Help &amp; Feedback</a></footer>
    </div>
    <script src="/scripts/readability.js?v=20260814-readability-2" defer></script>
      <script src="/scripts/language-switch-fix.js?v=20260820-language-active-2" defer></script>
  </body>
</html>
