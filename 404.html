<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — IberiGo</title>
    <link rel="stylesheet" href="/styles.css?v=20260926-timeline-stack" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="apple-touch-icon" href="/assets/favicon.svg" />
    <style data-iberigo-visual-ux-cleanup>
      html, body {
        max-width: 100%;
        overflow-x: clip;
      }
      .app-shell {
        max-width: 100%;
        min-width: 0;
        overflow-x: clip;
      }
      @media (max-width: 760px) {
        .topbar {
          display: flex !important;
          flex-wrap: wrap !important;
          align-items: center !important;
          gap: 4px 9px !important;
          padding: 6px 14px !important;
          min-width: 0;
          max-width: 100%;
          box-sizing: border-box;
        }
        .brand-lockup { flex: 0 1 auto; min-width: 0; }
        .brand-wordmark { font-size: 22px; }
        .topbar nav {
          display: flex !important;
          flex: 1 1 100% !important;
          width: 100% !important;
          min-width: 0 !important;
          flex-wrap: wrap !important;
          align-items: center !important;
          justify-content: flex-start !important;
          gap: 6px !important;
        }
        .topbar nav a {
          flex: 0 1 auto !important;
          min-height: 38px;
          padding: 8px 11px !important;
        }
        .topbar .search-nav-link { order: -2; }
        .topbar .language-switcher {
          order: -1;
          flex: 0 0 auto !important;
          width: auto !important;
          min-height: 38px;
          justify-content: flex-start !important;
          padding: 3px !important;
        }
        .topbar .language-switcher button {
          min-width: 34px;
          min-height: 32px;
        }
        main > section { scroll-margin-top: 118px; }
      }
      @media (max-width: 420px) {
        .topbar { padding-inline: 12px !important; gap: 4px 8px !important; }
        .topbar nav { gap: 3px 5px !important; }
        .topbar nav a {
          flex-basis: auto !important;
          padding-inline: 10px !important;
          font-size: 0.82rem;
        }
        .topbar .language-switcher {
          width: auto !important;
          justify-content: flex-start !important;
        }
        main > section { scroll-margin-top: 112px; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <a href="/" class="brand-wordmark" aria-label="IberiGo">Iberi<span class="brand-wordmark-accent">Go</span></a>
        </div>
        <nav aria-label="Main sections">
          <a href="/?nav=start#guide-cards">Home</a>
          <a href="/the-spain-files/">The Spain Files</a>
          <a href="/support/">Donate</a>
        </nav>
      </header>

      <main>
        <section class="panel" style="text-align: center; padding: 4rem 1.5rem;">
          <h1 style="margin-bottom: 0.75rem;">Page not found</h1>
          <p style="margin-bottom: 2rem;">This page doesn't exist or has moved. Try one of these instead:</p>
          <p>
            <a class="primary-action" href="/">Go to the homepage</a>
          </p>
          <p style="margin-top: 1.5rem;">
            <a href="/the-spain-files/">Read The Spain Files</a> ·
            <a href="/guides/nie/">NIE guide</a> ·
            <a href="/support/">Support IberiGo</a>
          </p>
        </section>
      </main>

      <footer class="site-footer">
        <a class="footer-help-feedback-link" href="/help-feedback/" data-help-feedback-footer>Help & Feedback</a>
        <div class="site-footer-legal">
          <p>© 2026 IberiGo. Free to use. Not legal advice.</p>
        </div>
      </footer>
    </div>
    <script>
      (function () {
        var topbar = document.querySelector(".topbar");
        if (!topbar) return;
        var update = function () {
          topbar.classList.toggle("is-scrolled", window.scrollY > 24);
        };
        update();
        window.addEventListener("scroll", update, { passive: true });
      })();
    </script>
    <script src="/scripts/readability.js?v=20260814-readability-2" defer></script>
      <script src="/scripts/language-switch-fix.js?v=20260820-language-active-2" defer></script>
  </body>
</html>
