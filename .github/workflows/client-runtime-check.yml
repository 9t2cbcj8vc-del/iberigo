name: Client runtime check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  client-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check runtime patch syntax
        run: node --check scripts/bake-action-first-runtime.js
      - name: Apply runtime patch
        run: node scripts/bake-action-first-runtime.js
      - name: Verify patched app.js syntax
        run: node --check app.js
      - name: Verify baked-DOM short circuit exists
        run: |
          grep -q 'data-iberigo-action-first-runtime' app.js
          grep -q 'bakedActionFirstPage' app.js
          grep -q 'data-iberigo-action-first' app.js
          grep -q 'showDirectGuide();' app.js
          grep -q 'directRoute: guideId' app.js
