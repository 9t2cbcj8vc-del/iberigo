name: One-shot September freshness

on:
  push:
    branches:
      - fix/digital-direct-appointment-links
    paths:
      - '.github/workflows/one-shot-september-freshness.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/digital-direct-appointment-links
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Stamp September freshness
        run: node scripts/stamp-freshness.js
      - name: Sync app.js cache-busting
        run: node scripts/sync-app-version.js
      - name: Remove one-shot workflow
        run: rm .github/workflows/one-shot-september-freshness.yml
      - name: Commit generated freshness updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply September freshness stamp"
          git push origin HEAD:fix/digital-direct-appointment-links
