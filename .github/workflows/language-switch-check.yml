name: Language switch check

on:
  pull_request:
    paths:
      - 'scripts/language-switch-fix.js'
      - 'scripts/bake-language-switch-fix.js'
      - 'scripts/language-switch-smoke.py'
      - 'netlify.toml'
      - '.github/workflows/language-switch-check.yml'

jobs:
  language-switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependency
        run: python -m pip install --disable-pip-version-check selenium==4.35.0
      - name: Test repeated EN/ES switching on deployed preview
        env:
          PREVIEW_BASE: https://deploy-preview-${{ github.event.pull_request.number }}--iberigo.netlify.app
        run: python scripts/language-switch-smoke.py
