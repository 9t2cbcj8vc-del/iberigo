name: Roadmap direct debug

on:
  pull_request:

jobs:
  debug-vida:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check selenium==4.35.0
      - name: Inspect vida laboral static guide
        env:
          PREVIEW_BASE: https://deploy-preview-${{ github.event.pull_request.number }}--iberigo.netlify.app
        run: python scripts/roadmap-direct-debug.py
