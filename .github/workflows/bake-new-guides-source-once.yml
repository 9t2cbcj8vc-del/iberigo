name: Bake new guides into source once

on:
  push:
    branches:
      - hotfix/bake-new-guides-source

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/bake-new-guides-source
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate source artifacts
        run: |
          node scripts/add-long-term-and-documents-guides.js
          node scripts/fix-new-guide-language-links.js
      - name: Commit generated pages and remove one-off workflow
        run: |
          rm .github/workflows/bake-new-guides-source-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            living-in-spain/staying-long-term/index.html \
            es/living-in-spain/staying-long-term/index.html \
            moving-to-spain/documents-apostilles-translations/index.html \
            es/moving-to-spain/documents-apostilles-translations/index.html \
            guides/living-in-spain/index.html \
            guides/es/living-in-spain/index.html \
            search-index.json \
            sitemap.xml \
            sitemap-pages.xml \
            .github/workflows/bake-new-guides-source-once.yml
          git commit -m "Bake new guide clusters into source"
          git push origin HEAD:hotfix/bake-new-guides-source
