name: Roadmap source debug

on:
  pull_request:
    paths:
      - 'scripts/roadmap-source-debug.py'
      - 'scripts/roadmap-source-completion.js'
      - 'scripts/roadmap-next-actions.js'
      - 'scripts/bake-roadmap-next-actions.js'
      - '.github/workflows/roadmap-source-debug.yml'

jobs:
  debug-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check selenium==4.35.0
      - name: Inspect EU employee source rendering
        env:
          PREVIEW_BASE: https://deploy-preview-${{ github.event.pull_request.number }}--iberigo.netlify.app
        run: python scripts/roadmap-source-debug.py
