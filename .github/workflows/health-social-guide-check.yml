name: Health and Social guide check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  health-social-guides:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check guide scripts
        run: |
          node --check scripts/clean-health-social-legacy-sections.js
          node --check scripts/bake-health-social-action-guides.js
          python -m py_compile scripts/health-social-audit.py
          python -m py_compile scripts/browser-health-social-audit.py
      - name: Bake crawler-first guide introductions locally
        run: node scripts/bake-crawler-first-guides.js
      - name: Remove legacy healthcare and Social Security sections locally
        run: node scripts/clean-health-social-legacy-sections.js
      - name: Bake healthcare and Social Security guides locally
        run: node scripts/bake-health-social-action-guides.js
      - name: Audit local output
        run: python scripts/health-social-audit.py --local
      - name: Audit deployed Netlify preview
        env:
          PREVIEW_BASE: https://deploy-preview-${{ github.event.number }}--iberigo.netlify.app
        run: python scripts/health-social-audit.py --preview
      - name: Install browser audit dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Audit rendered preview in Chromium
        env:
          PREVIEW_BASE: https://deploy-preview-${{ github.event.number }}--iberigo.netlify.app
        run: python scripts/browser-health-social-audit.py
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-social-browser-screenshots
          path: browser-health-social/*.png
          if-no-files-found: ignore
