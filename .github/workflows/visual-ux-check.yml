name: Visual UX check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  visual-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check visual cleanup script syntax
        run: node --check scripts/bake-visual-ux-cleanup.js
      - name: Check action-first renderer syntax
        run: node --check scripts/bake-action-first-guides.js
      - name: Check action-first client runtime patch syntax
        run: node --check scripts/bake-action-first-runtime.js
      - name: Check visual audit syntax
        run: |
          python -m py_compile scripts/visual-ux-audit.py
          python -m py_compile scripts/browser-action-first-audit.py
      - name: Bake action-first cards locally
        run: node scripts/bake-action-first-guides.js
      - name: Bake visual UX cleanup locally
        run: node scripts/bake-visual-ux-cleanup.js
      - name: Patch client runtime locally
        run: node scripts/bake-action-first-runtime.js
      - name: Sync app.js cache-busting locally
        run: node scripts/sync-app-version.js
      - name: Audit visual UX locally
        run: python scripts/visual-ux-audit.py --local
      - name: Audit deployed Netlify preview files
        env:
          PREVIEW_BASE: https://deploy-preview-${{ github.event.number }}--iberigo.netlify.app
        run: python scripts/visual-ux-audit.py --preview
      - name: Install browser audit dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Audit rendered Netlify preview in Chromium
        env:
          PREVIEW_BASE: https://deploy-preview-${{ github.event.number }}--iberigo.netlify.app
        run: python scripts/browser-action-first-audit.py
      - name: Upload browser audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: action-first-browser-screenshots
          path: browser-audit/*.png
          if-no-files-found: ignore
