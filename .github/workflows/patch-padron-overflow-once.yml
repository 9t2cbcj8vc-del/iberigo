name: Patch Padrón overflow once

on:
  push:
    branches:
      - fix/padron-spain-files-mobile-overflow

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/padron-spain-files-mobile-overflow
          fetch-depth: 0
      - name: Apply scoped mobile table fix
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('the-spain-files/padron-torrevieja/index.html'),
              Path('the-spain-files/es/padron-torrevieja/index.html'),
          ]
          marker = "      .article-experience p.experience-note { margin: 0.75rem 0 0; font-size: 13px; color: #888; font-style: normal; }\n"
          addition = marker + """
      /* Keep the four-column Torrevieja timeline inside narrow phone viewports. */
      @media (max-width: 520px) {
        .article-wrap { width: 100%; max-width: 100%; box-sizing: border-box; }
        .article-body { min-width: 0; }
        .article-body table { width: 100%; max-width: 100%; table-layout: fixed; }
        .article-body th,
        .article-body td {
          padding: 0.5rem 0.35rem;
          overflow-wrap: anywhere;
          word-break: normal;
        }
      }
"""
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if 'Keep the four-column Torrevieja timeline inside narrow phone viewports.' in text:
                  continue
              if marker not in text:
                  raise SystemExit(f'Expected style marker not found in {path}')
              path.write_text(text.replace(marker, addition, 1), encoding='utf-8')
          PY
      - name: Commit source fix and remove one-shot workflow
        run: |
          rm .github/workflows/patch-padron-overflow-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add the-spain-files/padron-torrevieja/index.html the-spain-files/es/padron-torrevieja/index.html .github/workflows/patch-padron-overflow-once.yml
          git commit -m "Fix Padrón Spain Files mobile table overflow"
          git push
