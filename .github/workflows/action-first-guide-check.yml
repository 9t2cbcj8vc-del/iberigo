name: Action-first guide check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  action-first-guides:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check action-first renderer syntax
        run: node --check scripts/bake-action-first-guides.js
      - name: Check action-first audit syntax
        run: python -m py_compile scripts/action-first-audit.py
      - name: Bake action-first cards locally
        run: node scripts/bake-action-first-guides.js
      - name: Audit action-first cards locally
        run: python scripts/action-first-audit.py --local
      - name: Audit deployed Netlify preview
        env:
          PREVIEW_BASE: https://deploy-preview-${{ github.event.number }}--iberigo.netlify.app
        run: python scripts/action-first-audit.py --preview
