name: Overhaul sanity check

on:
  pull_request:
    paths:
      - 'scripts/visual-overhaul.js'
      - 'scripts/semantic-visual-overrides.js'
      - 'scripts/site-search.js'
      - 'styles-overhaul.css'
      - '.github/workflows/overhaul-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check scripts/visual-overhaul.js
          node --check scripts/semantic-visual-overrides.js
          node --check scripts/site-search.js
      - name: Check referenced internal paths
        run: |
          node <<'NODE'
          const fs = require('fs');
          const sources = [
            fs.readFileSync('scripts/visual-overhaul.js', 'utf8'),
            fs.readFileSync('scripts/semantic-visual-overrides.js', 'utf8')
          ].join('\n');
          const paths = [...sources.matchAll(/["'`]\/(?:assets|guides|moving-to-spain|living-in-spain|es|start-here|the-spain-files)[^"'`?#)]*/g)]
            .map(m => m[0].slice(1))
            .filter(p => !p.includes('${'));
          const unique = [...new Set(paths)];
          const missing = [];
          for (const webPath of unique) {
            let p = webPath.replace(/^\//, '');
            if (p.startsWith('assets/')) {
              if (!fs.existsSync(p)) missing.push(webPath);
              continue;
            }
            if (p.endsWith('/')) p += 'index.html';
            if (!fs.existsSync(p)) missing.push(webPath);
          }
          if (missing.length) {
            console.error('Missing internal references:');
            missing.forEach(p => console.error(`- ${p}`));
            process.exit(1);
          }
          console.log(`Validated ${unique.length} internal references.`);
          NODE
